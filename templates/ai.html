{% extends "base.html" %}
{% block content %}

<div class="page-title">ИИ-следователь</div>
<div class="page-sub">Умный нейросетевой анализ логов и базы данных сервера</div>

<div class="card">
    <div class="card-label">Быстрые вопросы следователю</div>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;">
        <a href="/ai?q=Кто самые богатые игроки на сервере и есть ли среди них подозрительные?" class="btn btn-ghost" style="height:36px; font-size:12px;">Топ богачей и риски</a>
        <a href="/ai?q=Проверь богатых новичков 1-3 уровня, откуда у них деньги?" class="btn btn-ghost" style="height:36px; font-size:12px;">Богатые новички</a>
        <a href="/ai?q=Проанализируй последние денежные переводы на предмет покупки или продажи вирт" class="btn btn-ghost" style="height:36px; font-size:12px;">Анализ переводов</a>
        <a href="/ai?q=Какие IP-адреса имеют больше всего твинков?" class="btn btn-ghost" style="height:36px; font-size:12px;">Сетки твинков</a>
    </div>

    <form method="get" action="/ai" style="display:flex; gap:8px;">
        <input type="text" name="q" value="{{ q }}" placeholder="Задайте любой вопрос или напишите ник игрока..." class="input-field" style="flex:1;">
        <button type="submit" class="btn btn-danger">Спросить ИИ</button>
    </form>
</div>

{% if answer %}
<div class="card" style="border-color: rgba(59, 130, 246, 0.45);">
    <div class="card-label" style="color:#60A5FA;">Заключение ИИ-следователя</div>
    <div style="font-size:14px; line-height:1.65; white-space:pre-line;">{{ answer }}</div>
</div>
{% endif %}

{% endblock %}
